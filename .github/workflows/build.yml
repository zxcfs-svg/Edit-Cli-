name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Makefile (debug)
        run: |
          pwd
          ls -la Makefile || true
          cat -A Makefile || true

      - name: Build
        run: make

      - name: Test binary
        run: ./edit --help || true